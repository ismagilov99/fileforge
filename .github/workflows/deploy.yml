name: Deploy FileForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a reproducible dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing. Release is blocked until the lockfile and refreshed manifest are committed."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install and verify the pinned npm release
        run: |
          npm install --global npm@11.19.1
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm run manifest:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run audit
      - name: Generate CycloneDX SBOM
        run: npm run sbom -- "$RUNNER_TEMP/fileforge-sbom.cdx.json"
      - name: Upload software bill of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fileforge-sbom-release
          path: ${{ runner.temp }}/fileforge-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
