name: Deploy FileForge to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a reproducible dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run manifest:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run audit
      - name: Generate CycloneDX SBOM
        run: npm run sbom -- "$RUNNER_TEMP/fileforge-sbom.cdx.json"
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: fileforge-sbom-release
          path: ${{ runner.temp }}/fileforge-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
