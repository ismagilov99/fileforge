name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require a reproducible dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run manifest:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Generate CycloneDX SBOM
        run: npm run sbom -- "$RUNNER_TEMP/fileforge-sbom.cdx.json"
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: fileforge-sbom
          path: ${{ runner.temp }}/fileforge-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
