name: Prepare dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: prepare-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run audit
      - name: Regenerate and verify the source manifest
        run: npm run manifest:write && npm run manifest:check
      - name: Generate CycloneDX SBOM
        run: npm run sbom -- "$RUNNER_TEMP/fileforge-sbom.cdx.json"
      - name: Stage release prerequisites
        run: |
          mkdir -p "$RUNNER_TEMP/fileforge-release-prerequisites"
          cp package-lock.json MANIFEST.sha256 "$RUNNER_TEMP/fileforge-release-prerequisites/"
          cp "$RUNNER_TEMP/fileforge-sbom.cdx.json" "$RUNNER_TEMP/fileforge-release-prerequisites/"
      - name: Upload lockfile and validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: fileforge-release-prerequisites
          path: $RUNNER_TEMP/fileforge-release-prerequisites/
          if-no-files-found: error
          retention-days: 14
