name: Prepare dependency lock

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prepare-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Install and verify the pinned npm release
        run: |
          npm install --global npm@11.19.1
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Generate the lockfile from exact direct dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reinstall strictly from the generated lockfile
        run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run audit
      - name: Regenerate and verify the source manifest
        run: npm run manifest:write && npm run manifest:check
      - name: Generate CycloneDX SBOM
        run: npm run sbom -- "$RUNNER_TEMP/fileforge-sbom.cdx.json"
      - name: Stage release prerequisites
        run: |
          mkdir -p "$RUNNER_TEMP/fileforge-release-prerequisites"
          cp package-lock.json MANIFEST.sha256 "$RUNNER_TEMP/fileforge-release-prerequisites/"
          cp "$RUNNER_TEMP/fileforge-sbom.cdx.json" "$RUNNER_TEMP/fileforge-release-prerequisites/"
          printf '%s\n' "Generated by the Prepare dependency lock workflow after npm ci, code checks, browser tests, build and npm audit." > "$RUNNER_TEMP/fileforge-release-prerequisites/README.txt"
      - name: Upload lockfile and validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fileforge-release-prerequisites
          path: ${{ runner.temp }}/fileforge-release-prerequisites/
          if-no-files-found: error
          retention-days: 14
